# Voorbeeld van de geheime instellingen van esphome/pompput.yaml.
# Kopieer dit bestand naar esphome/secrets.yaml en vul het in. Commit secrets.yaml nooit;
# .gitignore houdt het buiten git.

# Een netwerk op 2,4 GHz: de ESP32-C3 kan geen 5 GHz.
wifi_ssid: "mijn-wifi"
wifi_password: "mijn-wifi-wachtwoord"

# 32 willekeurige bytes in base64 (44 tekens).
# De sleutel beveiligt zowel de koppeling met Home Assistant als de updates via WiFi (OTA),
# research R3. Maak hem eenmalig op de pc met:
#   python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "genereer-met-het-commando-hierboven"
